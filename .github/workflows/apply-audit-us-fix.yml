name: Apply audited US Social Security fix

on:
  push:
    branches:
      - audit-fixes-2026-08-28

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-28
          fetch-depth: 0
      - name: Apply audited replacements
        run: python scripts/apply-audit-us-fix.py
      - name: Commit audited fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countryRules/US.js App.jsx
          git commit -m "Fix US Social Security FRA by birth year"
          git push origin HEAD:audit-fixes-2026-08-28

name: Rule source watch

on:
  schedule:
    # Weekly is enough for statutory rule pages and avoids needless redeploys.
    # 00:15 UTC Monday = 09:15 JST Monday.
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rule-source-watch
  cancel-in-progress: false

jobs:
  watch:
    name: 公式制度ページを監視
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 公式制度ページを確認
        run: node scripts/check-rule-sources.mjs

      - name: 実質的な変更か判定
        id: diff
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');

          const current = JSON.parse(fs.readFileSync('public/rules-source-status.json', 'utf8'));
          let previous = { schemaVersion: 1, checkedAt: '', sources: [] };
          try {
            previous = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:public/rules-source-status.json'], { encoding: 'utf8' }));
          } catch {}

          const normalize = (payload) => ({
            schemaVersion: payload?.schemaVersion || 1,
            sources: Array.isArray(payload?.sources)
              ? payload.sources.map(({ checkedAt, ...source }) => source)
              : [],
          });

          const changed = JSON.stringify(normalize(current)) !== JSON.stringify(normalize(previous));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

      - name: 変更を保存
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rules-source-status.json
          git commit -m "chore: update rule source watch status"
          git push

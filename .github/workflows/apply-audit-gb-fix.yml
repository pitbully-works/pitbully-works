name: Apply audited GB pension access fix

on:
  push:
    branches:
      - audit-fixes-2026-08-28

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run audited GB pension access fixer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-28
          fetch-depth: 0
      - name: Apply audited GB fix
        run: python scripts/apply-audit-gb-fix.py
      - name: Commit audited GB fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add countryRules/GB.js App.jsx gbBoundaries.test.js
          git commit -m "Fix GB 2028 pension access transition"
          git push origin HEAD:audit-fixes-2026-08-28
